# 【2026-11-23 用户定】整机不要 IPv6 —— 连 link-local（fe80::）也不要。
#
# 只把 dhcp.lan.ra 设 disabled 只是「不发 RA」，内核仍会在每个接口上自动挂一个
# fe80:: 链路本地地址（br-lan 上实测还有 fe80::327b:acff:fef9:2d2f）。
# 要让接口上彻底没有 v6 地址，必须 disable_ipv6=1。
#
# 影响：honk 的 dae0 上那个 fd00:686f:6e6b::1/64 也是 v6，全局关掉后 honk 会记
# 一条 dae0 加地址失败的日志，v4 tproxy 不受影响。若哪天要 honk 的 v6 内网地址，
# 删掉本文件即可恢复。
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
