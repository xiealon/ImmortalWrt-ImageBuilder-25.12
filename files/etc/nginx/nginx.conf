# 【2026-11-19】固件自带的最小可用 nginx 配置。
# 官方 nginx-full 不提供 /etc/nginx/nginx.conf（只给 uci.conf.template，
# 且模板里的 include 是相对路径，生成到 /var/lib/nginx 后找不到 mime.types），
# 装上直接 nginx -t 会失败。这里放一份静态配置顶上：
#   · 默认监听 8088（8080 已留给 crowdsec 容器与宿主机的日志通信）
#   · worker_processes 1，路由器上省内存（实测 master 约 7MB）
#   · root /www，conf.d/*.conf 放自己的 server 块
# 反代示例（写到 /etc/nginx/conf.d/nas.conf）：
#   server {
#       listen 8089;
#       server_name nas.lan;
#       location / { proxy_pass http://192.168.1.10:5000;
#                    proxy_set_header Host $host; }
#   }
worker_processes 1;
user root;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    access_log off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    client_max_body_size 128M;
    root /www;
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 8088 default_server;
        listen [::]:8088 default_server;
        server_name _;
        location / { try_files $uri $uri/ =404; }
    }
}
